# Prepara o Godot para o CI: xvfb e Vulkan por software, o binário (em cache) em GODOT_BIN e a
# importação dos recursos, obrigatória num clone novo (tools/godot.sh importar).
name: Godot
description: Instala o Godot do GODOT_VERSION em GODOT_BIN e importa o projeto

runs:
  using: composite
  steps:
    - name: Instalar xvfb e Vulkan por software
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb xauth mesa-vulkan-drivers libvulkan1 libgl1 libasound2t64 >/dev/null

    - name: Godot em cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/../godot
        key: godot-${{ env.GODOT_VERSION }}-linux

    - name: Baixar o Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        pasta="$(dirname "$GODOT_BIN")"
        mkdir -p "$pasta"
        curl -fsSL -o /tmp/godot.zip \
          "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d "$pasta"
        chmod +x "$GODOT_BIN"

    - name: Importar os recursos
      shell: bash
      run: |
        "$GODOT_BIN" --version
        tools/godot.sh importar

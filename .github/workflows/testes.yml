# Suíte gdUnit4 a cada push e pull request. Roda como na VM de desenvolvimento: tools/godot.sh testes,
# com tela no xvfb (os testes de interface simulam mouse e teclado) e Vulkan por software (lavapipe),
# no nível gráfico baixo. Uma pasta de testes por job, em paralelo: a suíte inteira num job só leva
# mais de 20 minutos e aperta a memória.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  # fora do checkout e sem ".." no caminho: o actions/cache recusa caminho relativo
  GODOT_BIN: /home/runner/godot/Godot_v4.7.2-stable_linux.x86_64

jobs:
  scripts:
    name: Compilar os scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/godot
      - name: Compilar todos os scripts
        run: tools/godot.sh godot --headless --path . --script res://tools/check_scripts.gd
      # Fase 50: as peças do kit de época (assets/kit) passam pelas regras de importação
      - name: Conferir o kit de época
        run: tools/godot.sh godot --headless --path . res://tools/import/validate_assets.tscn

  testes:
    name: Testes (${{ matrix.pasta }})
    needs: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pasta: [core, data, sim, world, tools, presentation, ui]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/godot
      - name: Rodar a suíte da pasta
        # os testes que falharem viram anotações do run (a API pública mostra sem login; o log do job pede login)
        run: |
          set +e
          tools/godot.sh testes res://tests/${{ matrix.pasta }} 2>&1 | tee saida.txt
          status=${PIPESTATUS[0]}
          sed 's/\x1b\[[0-9;]*m//g' saida.txt | grep -E '> test_.* FAILED|Expecting|but was' | head -40 | while read -r linha; do echo "::error::$linha"; done
          exit $status
      - name: Guardar o relatório
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-${{ matrix.pasta }}
          path: reports/
          if-no-files-found: ignore

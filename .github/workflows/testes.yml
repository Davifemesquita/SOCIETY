# Suíte gdUnit4 a cada push e pull request. Roda como na VM de desenvolvimento: tools/godot.sh testes,
# com tela no xvfb (os testes de interface simulam mouse e teclado) e Vulkan por software (lavapipe),
# no nível gráfico baixo. Uma pasta de testes por job, em paralelo: a suíte inteira num job só leva
# mais de 20 minutos e aperta a memória.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fase 48 (ramo godot-4.8): a beta vem do godotengine/godot-builds; na estável, volta ao padrão de sempre
  GODOT_VERSION: 4.8-beta1
  GODOT_RELEASES: https://github.com/godotengine/godot-builds/releases/download/4.8-beta1
  # fora do checkout e sem ".." no caminho: o actions/cache recusa caminho relativo
  GODOT_BIN: /home/runner/godot/Godot_v4.8-beta1_linux.x86_64

jobs:
  scripts:
    name: Compilar os scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/godot
      - name: Compilar todos os scripts
        run: tools/godot.sh godot --headless --path . --script res://tools/check_scripts.gd

  testes:
    name: Testes (${{ matrix.pasta }})
    needs: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pasta: [core, data, sim, world, tools, presentation, ui]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/godot
      - name: Rodar a suíte da pasta
        run: tools/godot.sh testes res://tests/${{ matrix.pasta }}
      - name: Guardar o relatório
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-${{ matrix.pasta }}
          path: reports/
          if-no-files-found: ignore
